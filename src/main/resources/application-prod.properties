# -----------------------------------------------------------------------
# Perfil PROD — usa PostgreSQL
# Para ativar: mude spring.profiles.active=prod em application.properties
# Ou rode com: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# -----------------------------------------------------------------------

# Configurações do PostgreSQL
# Ajuste o host, porta, nome do banco, usuário e senha conforme seu ambiente
spring.datasource.url=jdbc:postgresql://localhost:5432/agendamentodb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# update: mantém os dados entre reinicializações
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console desabilitado em produção
spring.h2.console.enabled=false
