# -----------------------------------------------------------------------
# Perfil PROD — usa PostgreSQL (usado no deploy, ex: Render)
#
# As credenciais são lidas de variáveis de ambiente, para nunca ficarem
# escritas no código/GitHub. O formato ${VAR:padrao} usa o valor da
# variável de ambiente VAR e, se ela não existir, cai no "padrao" (útil
# para rodar localmente contra um Postgres na sua máquina).
# -----------------------------------------------------------------------

# Conexão com o PostgreSQL (definidas no painel do Render como env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agendamentodb}
# Força o driver do PostgreSQL neste perfil (garante que não cai no H2)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# update: cria as tabelas se não existirem e mantém os dados entre reinícios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console desabilitado em produção
spring.h2.console.enabled=false
