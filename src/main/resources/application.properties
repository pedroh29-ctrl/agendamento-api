# Nome da aplicação
spring.application.name=agendamento-api

# Perfil ativo:
#   file → H2 em arquivo, dados PERSISTEM entre reinícios (padrão atual)
#   dev  → H2 em memória, dados descartáveis (bom para testes rápidos)
#   prod → PostgreSQL
spring.profiles.active=file

# Porta do servidor
server.port=8080

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
