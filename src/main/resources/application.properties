# Nome da aplicação
spring.application.name=agendamento-api

# Perfil ativo (pode ser sobrescrito pela variável de ambiente SPRING_PROFILES_ACTIVE):
#   file → H2 em arquivo, dados PERSISTEM entre reinícios (padrão local)
#   dev  → H2 em memória, dados descartáveis (bom para testes rápidos)
#   prod → PostgreSQL (usado no deploy na nuvem)
# No Render, definimos a env var SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:file}

# Porta do servidor.
# Na nuvem, a plataforma injeta a porta pela variável de ambiente PORT.
# Localmente, se PORT não existir, usa 8080.
server.port=${PORT:8080}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
