# -----------------------------------------------------------------------
# Perfil DEV — usa H2 em memória (padrão para desenvolvimento)
# -----------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:agendamentodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# -----------------------------------------------------------------------
# Credenciais de acesso (definidas em SecurityConfig.java)
# -----------------------------------------------------------------------
# admin / admin123 — acesso total
# user  / user123  — acesso de escrita básico
