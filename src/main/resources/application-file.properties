# -----------------------------------------------------------------------
# Perfil FILE — H2 gravando em ARQUIVO (dados persistem entre reinícios)
#
# Diferença para o perfil "dev": aqui o banco é salvo em disco, na pasta
# ./data/agendamentodb.mv.db (dentro do projeto), e o schema é mantido
# (ddl-auto=update) em vez de recriado a cada start.
#
# Use este perfil quando quiser que os cadastros fiquem salvos.
# Para voltar ao banco descartável em memória, use o perfil "dev".
# -----------------------------------------------------------------------

# ./data/agendamentodb → cria os arquivos do banco na pasta "data" do projeto
spring.datasource.url=jdbc:h2:file:./data/agendamentodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update: cria as tabelas se não existirem e MANTÉM os dados entre reinícios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
